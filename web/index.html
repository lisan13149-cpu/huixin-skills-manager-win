<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汇芯技能管家 · Windows 版</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">汇</div>
      <div class="brand-text">
        <h1>汇芯技能管家</h1>
        <p class="sub">Windows 本地版 · <span id="statTotal">—</span> 个技能 · <span id="statSources">—</span> 个来源</p>
      </div>
    </div>
    <div class="tools">
      <div class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 0 3.4 9.8l3.1 3.1 1.4-1.4-3.1-3.1A5.5 5.5 0 0 0 8.5 3Zm0 2a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Z"/></svg>
        <input id="search" type="search" placeholder="搜索中文名、原始名、说明" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <button id="btnRefresh" class="btn" title="重新扫描技能目录">刷新</button>
      <button id="btnSettings" class="btn icon" title="设置" aria-label="设置">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm0 2a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm8 1.5-.1-1.2 1.4-1.1-1.4-2.4-1.7.5a6.6 6.6 0 0 0-2-1.2L13.8 3H10.9l-.4 1.6a6.6 6.6 0 0 0-2 1.2l-1.7-.5L5.4 7.7l1.4 1.1a6.6 6.6 0 0 0 0 2.4L5.4 12.3l1.4 2.4 1.7-.5a6.6 6.6 0 0 0 2 1.2l.4 1.6h2.9l.4-1.6a6.6 6.6 0 0 0 2-1.2l1.7.5 1.4-2.4-1.4-1.1.1-1.2Z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-block">
        <div class="side-title">来源</div>
        <div id="sourceList" class="side-list"></div>
      </div>
      <div class="side-block">
        <div class="side-title">按用途</div>
        <div id="catList" class="side-list"></div>
      </div>
      <div class="side-block">
        <div class="side-title">
          我的分类
          <button id="btnNewCollection" class="mini-btn" title="新建分类">＋</button>
        </div>
        <div id="collectionList" class="side-list"></div>
      </div>
      <div class="side-foot">
        <div class="foot-line">只读扫描，不改技能文件</div>
        <div class="foot-line" id="footVersion">—</div>
      </div>
    </aside>

    <main class="main">
      <div class="mainbar">
        <div class="crumbs">
          <span id="crumbRoot">全部技能</span>
          <span id="crumbSub" class="crumb-sub"></span>
        </div>
        <div class="main-tools">
          <select id="mobileCat" class="select mobile-only" title="按用途筛选"></select>
          <select id="mobileSource" class="select mobile-only" title="按来源筛选"></select>
          <select id="sort" class="select" title="排序">
            <option value="recent">最近更新</option>
            <option value="name">按名称</option>
            <option value="source">按来源</option>
          </select>
          <button id="btnExport" class="btn ghost" title="导出 JSON 清单">导出</button>
        </div>
      </div>

      <div id="grid" class="grid" aria-live="polite"></div>
      <div id="empty" class="empty" hidden>
        <div class="empty-mark">∅</div>
        <p id="emptyText">没有匹配的技能</p>
        <button id="btnClear" class="btn ghost">清除筛选</button>
      </div>
    </main>
  </div>
</div>

<div id="overlay" class="overlay" hidden></div>

<aside id="drawer" class="drawer" hidden aria-label="技能详情">
  <div class="drawer-head">
    <div>
      <h2 id="dTitle">—</h2>
      <div class="d-raw"><span id="dRaw">—</span><button class="copy-mini" id="dCopyName" title="复制原始调用名">复制</button></div>
    </div>
    <button id="dClose" class="btn icon" aria-label="关闭">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.3 4 4.7 4.7L14.7 4 16 5.3 11.3 10l4.7 4.7-1.3 1.3-4.7-4.7L5.3 16 4 14.7 8.7 10 4 5.3 5.3 4Z"/></svg>
    </button>
  </div>
  <div class="d-meta" id="dMeta"></div>
  <div class="d-path"><code id="dPath">—</code></div>
  <div class="d-actions">
    <button class="btn small" data-dact="reveal">打开文件夹</button>
    <button class="btn small" data-dact="open">默认程序打开</button>
    <button class="btn small" data-dact="copyPath">复制路径</button>
    <button class="btn small" id="dPin" data-dact="pin">收藏</button>
  </div>
  <div class="d-collections" id="dCollections"></div>
  <div class="d-body" id="dBody"><div class="loading">正在读取 SKILL.md…</div></div>
</aside>

<div id="menu" class="menu" hidden></div>

<div id="modal" class="modal" hidden>
  <div class="modal-panel">
    <div class="modal-head">
      <h3 id="modalTitle">设置</h3>
      <button id="modalClose" class="btn icon" aria-label="关闭">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.3 4 4.7 4.7L14.7 4 16 5.3 11.3 10l4.7 4.7-1.3 1.3-4.7-4.7L5.3 16 4 14.7 8.7 10 4 5.3 5.3 4Z"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
